[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studiocutter3d"
version = "0.2.0"
description = "Convierte line art en cortantes de galletitas imprimibles (.3mf / .stl), sin alterar el dibujo."
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "shapely>=2.1",
    "trimesh>=4.5",
    "manifold3d>=3.0",
    "mapbox-earcut>=1.0",
    "scikit-image>=0.24",
    "pillow>=11.0",
    "pillow-heif>=1.7",   # HEIC/HEIF: el formato por default de las fotos de iPhone
    "rawpy>=0.27",        # RAW de camara (ARW, CR2, CR3, DNG, NEF) via LibRaw
    "svgelements>=1.9",
    "vtracer>=0.6.15",
    "resvg-py>=0.5",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.9",
    "mypy>=1.13",
    "bandit>=1.8",
    "httpx>=0.28",     # lo necesita fastapi.testclient.TestClient
    "pip-audit>=2.10", # gate de CVEs
]
# Capa web (ciclo 2). El motor no depende de nada de esto: `pip install -e ".[web]"`.
# Todas pure-python: no hay riesgo de compilacion en Windows.
web = [
    "fastapi>=0.141",
    "uvicorn>=0.52",   # sin [standard]: arrastra deps con extensiones en C
    "jinja2>=3.1",
    "python-multipart>=0.0.32",
    "itsdangerous>=2.2",  # lo necesita SessionMiddleware de Starlette
    "argon2-cffi>=25.1",
]

[project.scripts]
cutter3d = "cutter3d.cli:main"

[tool.setuptools]
packages = ["cutter3d", "app", "app.routers"]

# ── Gates de calidad ────────────────────────────────────────────────────────
# Los corre la skill `gate` sobre los archivos de cada ciclo. Sin baseline:
# el proyecto arranca en cero y la deuda se mantiene en cero.

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C90", "PL", "RUF"]
ignore = [
    "PLR0913", # varios parametros con nombre es lo idiomatico para los params de geometria
    # N818 pide sufijo `Error` en las excepciones. Las de este proyecto tienen
    # nombre en espanol (`SvgInvalido`, `MallaNoManifold`, `BooleanaFallida`) y el
    # sufijo ingles las volveria hibridos ilegibles: `SvgInvalidoError`. Se prefiere
    # la coherencia del idioma del dominio por sobre la convencion de nombres.
    "N818",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"] # los numeros magicos en asserts son el punto del test

[tool.mypy]
strict = true
files = ["cutter3d", "app"]
python_version = "3.13"

# Unica perilla de `strict` que se afloja, y por una razon concreta: skimage y
# trimesh SI traen `py.typed`, pero exponen funciones sin anotar (`medial_axis`,
# `disk`, `threshold_otsu`, `PBRMaterial`, `TextureVisuals`, `Scene.export`).
# Como el modulo se resuelve, `ignore_missing_imports` no las alcanza y
# `disallow_untyped_calls` rechaza cada llamada. La alternativa seria sembrar
# `# type: ignore` por todo el codigo propio, que es peor: esconde tambien los
# errores reales. Todo el resto de `strict` sigue activo — definiciones sin
# tipar, Optional implicito, retornos Any, decoradores sin tipar.
disallow_untyped_calls = false

# Librerias sin stubs: se tipa el borde propio, no el de terceros.
[[tool.mypy.overrides]]
# `pillow-heif` y `rawpy` traen `py.typed`, asi que mypy resuelve el modulo y
# `ignore_missing_imports` no los alcanza — pero importan sus simbolos publicos
# sin re-exportarlos, y `strict` activa `no_implicit_reexport`. Se afloja solo
# para esos dos modulos de terceros: el codigo propio sigue con strict entero.
module = ["pillow_heif.*", "rawpy.*"]
implicit_reexport = true

[[tool.mypy.overrides]]
module = [
    "trimesh.*",
    "skimage.*",
    "scipy.*",
    "shapely.*",
    "svgelements.*",
    "vtracer.*",
    "resvg_py.*",
    "mapbox_earcut.*",
    "manifold3d.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "lento: corre el motor de verdad en un proceso hijo (segundos, no milisegundos)",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
