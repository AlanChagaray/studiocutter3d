# =============================================================================
# Dependabot — lo que hay que actualizar y nadie va a mirar todas las semanas.
#
# Tres ecosistemas, los tres con algo clavado a propósito en este repo:
#
#   github-actions  las acciones de terceros van pineadas por SHA en los
#                   ci-*.yml; Dependabot mueve el hash Y el comentario de versión
#   pip             SOLO avisos de seguridad (ver abajo por qué no versiones):
#                   requirements.txt es el cierre transitivo exacto de la imagen
#                   y se regenera entero, no de a un pin
#   docker          la base del Dockerfile va por digest; Dependabot propone el
#                   digest nuevo cuando python:3.13-slim-bookworm se reconstruye
#
# Cada PR que abre pasa por las mismas compuertas que un PR humano (ci-build
# construye y escanea la imagen candidata). El nombre de rama `dependabot/...`
# está aceptado explícitamente en ci-quality.yml; el tipo del release sale del
# prefijo del commit configurado acá (`chore:` → sube PARCHE).
# =============================================================================
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Argentina/Buenos_Aires
    commit-message:
      prefix: ci
    # Un solo PR con todas las acciones: son cambios de hash sin riesgo
    # funcional, y revisar seis PRs de una línea es lo que hace que no se
    # revise ninguno.
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Argentina/Buenos_Aires
    commit-message:
      prefix: chore
    # ⚠ 0 = sin actualizaciones de VERSIÓN; los PRs de SEGURIDAD (alertas de
    # Dependabot) siguen saliendo. Es a propósito, y lo enseñó el primer PR que
    # abrió: subió `pydantic-core` 2.46.5 → 2.49.0 dejando `pydantic==2.13.5`,
    # que exige exactamente la 2.46.5, y el build murió en `ResolutionImpossible`.
    # requirements.txt es el cierre transitivo CONGELADO de la imagen (ver
    # DESPLIEGUE.md §6): mover un pin de a uno sin re-resolver rompe cualquier
    # pareja clavada (pydantic ↔ pydantic-core, argon2-cffi ↔ bindings), y un
    # grupo no lo arregla porque Dependabot no resuelve, reemplaza. La CI lo
    # frenó, que es su trabajo — pero un PR roto por semana es ruido que enseña
    # a ignorar. La señal de "hay que actualizar" la da `pip-audit` todos los
    # días en ci-security; la actualización se hace regenerando el freeze
    # completo (§6) o, el día que se quiera automatizar bien, con un lock de
    # verdad (pip-tools / uv) que Dependabot sí sabe re-resolver.
    open-pull-requests-limit: 0

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Argentina/Buenos_Aires
    commit-message:
      prefix: chore
    # Solo el DIGEST de python:3.13-slim-bookworm (parches de Debian y de
    # Python 3.13.x). Sin esto, el primer PR que abrió fue `python:3.14`: subir
    # de Python es una decisión del proyecto —requires-python, ruff, mypy y la
    # CI dicen 3.13, y `coherencia` lo rechaza—, no una actualización semanal.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
